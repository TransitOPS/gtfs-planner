name: Set up Elixir
description: Install the pinned Erlang, Elixir and protobuf toolchain for CI jobs.

outputs:
  otp-version:
    value: ${{ steps.beam.outputs.otp-version }}
  elixir-version:
    value: ${{ steps.beam.outputs.elixir-version }}
runs:
  using: "composite"
  steps:
    - name: Set up Elixir
      id: beam
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        version-file: ".tool-versions"
        version-type: "strict"
    - name: Set up other tools with Mise
      uses: ./.github/actions/mise
      with:
        install_args: "protoc"
