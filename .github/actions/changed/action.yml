name: Detect Changed Files
description: Select the CI jobs affected by the diff, or all jobs for scheduled runs.

outputs:
  elixir-changed:
    value: ${{ github.event_name == 'schedule' || fromJSON(steps.changes.outputs.elixir) || fromJSON(steps.changes.outputs.shared) }}
  js-changed:
    value: ${{ github.event_name == 'schedule' || fromJSON(steps.changes.outputs.js) || fromJSON(steps.changes.outputs.shared) }}
  infra-changed:
    value: ${{ github.event_name == 'schedule' || fromJSON(steps.changes.outputs.infra) || fromJSON(steps.changes.outputs.docker) || fromJSON(steps.changes.outputs.shared) }}
  docker-changed:
    value: ${{ github.event_name == 'schedule' || fromJSON(steps.changes.outputs.docker) || fromJSON(steps.changes.outputs.elixir) || fromJSON(steps.changes.outputs.js) || fromJSON(steps.changes.outputs.shared) }}

runs:
  using: "composite"
  steps:
    - name: Detect Changed Files
      id: changes
      uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
      with:
        filters: |
          elixir:
            - 'mix.lock'
            - '**/*.ex'
            - '**/*.exs'
            - '**/*.heex'
            - 'priv/gtfs_validator/**'
            - '.credo.exs'
            - '.formatter.exs'
            - '.sobelow-conf'
            - 'coveralls.json'
            - 'bin/test-all'
            - 'bin/test-affected'
            - 'bin/lib/browser-stack.sh'
          js:
            - 'assets/**/*.js'
            - 'assets/**/*.cjs'
            - 'assets/**/*.css'
            - 'assets/*.json'
            - 'assets/.postcssrc'
            - 'assets/.prettier*'
            - 'assets/eslint.config.mjs'
            - 'lib/gtfs_planner_web/**/*.heex'
            - 'config/**'
            - 'mix.exs'
            - 'mix.lock'
            - 'lib/gtfs_planner_web/components/**/*.ex'
            - 'lib/gtfs_planner_web/live/**/*.ex'
            - 'bin/test-browser'
            - 'bin/lib/browser-stack.sh'
          infra:
            - 'infra/**/*.tf'
            - 'bin/**'
            - 'mise-tasks/**'
          docker:
            - 'Dockerfile'
            - '.dockerignore'
          shared:
            - '.tool-versions'
            - 'mise.toml'
            - 'bin/check-ci-results'
            - 'test/scripts/check-ci-results-test'
            - '.github/**/*'
