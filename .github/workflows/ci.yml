name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check for Changes
    runs-on: ${{ fromJSON(vars.GH_RUNNER_LABEL) }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Check CI result guard
        run: bash test/scripts/check-ci-results-test
      - name: Check for changes
        id: changes
        uses: ./.github/actions/changed
      - run: |
          echo elixir-changed: ${{ steps.changes.outputs.elixir-changed }}
          echo js-changed: ${{ steps.changes.outputs.js-changed }}
          echo docker-changed: ${{ steps.changes.outputs.docker-changed }}
          echo infra-changed: ${{ steps.changes.outputs.infra-changed }}
    outputs:
      elixir-changed: ${{ steps.changes.outputs.elixir-changed }}
      js-changed: ${{ steps.changes.outputs.js-changed }}
      docker-changed: ${{ steps.changes.outputs.docker-changed }}
      infra-changed: ${{ steps.changes.outputs.infra-changed }}

  elixir_deps:
    name: Build Elixir dependencies
    runs-on: ${{ fromJSON(vars.GH_RUNNER_LABEL) }}
    needs: [changes]
    if: ${{ needs.changes.outputs.elixir-changed == 'true' || needs.changes.outputs.js-changed == 'true' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Elixir
        uses: ./.github/actions/elixir
        id: beam
      - name: Restore dependencies cache
        id: deps_cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          # Cache key based on Erlang/Elixir version and the mix.lock hash
          key: |
            deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
          path: |
            deps
            _build
      - name: Build dependencies (if needed)
        if: steps.deps_cache.outputs.cache-hit != 'true'
        run: |
          mise run elixir:deps -f
          mix deps.compile
          MIX_ENV=test mix deps.compile
      - name: Save dependencies cache
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        if: steps.deps_cache.outputs.cache-hit != 'true'
        with:
          key: |
            deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          path: |
            deps
            _build

  elixir_test:
    name: Elixir (test)
    runs-on: ${{ fromJSON(vars.GH_RUNNER_LABEL) }}
    needs: [changes, elixir_deps]
    if: ${{ needs.changes.outputs.elixir-changed == 'true' }}
    env:
      # bin/test-all otherwise starts host pg_tmp servers and ignores this service.
      # Use the disposable PostGIS service for the full suite and validator CLI.
      TEST_PARTITIONS: '1'
      MIX_ENV: test
      GTFS_PLANNER_TEST_DATABASE_URL: postgres://gtfs_planner_test:gtfs_planner_test@localhost:5432/gtfs_planner_exunit

    services:
      postgres:
        image: postgis/postgis:17-3.5
        ports:
          - 5432:5432
        env:
          # config/test.exs connects as this role.
          POSTGRES_PASSWORD: gtfs_planner_test
          POSTGRES_USER: gtfs_planner_test
          POSTGRES_DB: pathways_test
        # memory limit is 3GB
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5 --memory 3000000000

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Elixir
        uses: ./.github/actions/elixir
        id: beam
      - name: Restore dependencies cache
        id: deps_cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          # Cache key based on Erlang/Elixir version and the mix.lock hash
          key: |
            deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
          path: |
            deps
            _build
      - name: Compile without warnings
        run: mix compile --force --warnings-as-errors
      - name: Run tests with coverage
        run: mise run test:elixir --cover
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Run validator CLI tests
        run: mise run elixir:deps && mix test --only validator_cli

  elixir_dev:
    name: Elixir (dev)
    runs-on: ${{ fromJSON(vars.GH_RUNNER_LABEL) }}
    needs: [changes, elixir_deps]
    if: ${{ needs.changes.outputs.elixir-changed == 'true' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Set up Elixir
        uses: ./.github/actions/elixir
        id: beam
      - name: Restore dependencies cache
        id: deps_cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          # Cache key based on Erlang/Elixir version and the mix.lock hash
          key: |
            deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
          path: |
            deps
            _build
      - name: Check unused lock entries
        run: MIX_ENV=test mix deps.unlock --check-unused
      - name: Check formatting
        run: mise run lint:elixir:format
      - name: Fetch main for credo diff
        # actions/checkout fetched only the PR merge ref, so credo's
        # --from-git-ref origin/main needs the remote-tracking ref created.
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Run credo
        run: mise run lint:elixir:credo
      - name: Run sobelow
        run: mise run lint:elixir:sobelow
      - name: Restore PLT cache
        id: plt_cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          # Cache key based on Erlang/Elixir version and the mix.lock hash
          key: |
            plt-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
          path: priv/plts
      - name: Build PLTs (if needed)
        if: steps.plt_cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt
      - name: Save PLT cache
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        if: steps.plt_cache.outputs.cache-hit != 'true'
        with:
          key: |
            plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          path: priv/plts
      - name: Run dialyzer
        run: mise run lint:elixir:dialyzer

  js:
    name: JS
    runs-on: ${{ fromJSON(vars.GH_RUNNER_LABEL) }}
    needs: [changes, elixir_deps]
    if: ${{ needs.changes.outputs.js-changed == 'true' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Elixir
        uses: ./.github/actions/elixir
        id: beam
      - name: Set up Node
        id: node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: "assets/package-lock.json"
      - name: Restore Elixir dependencies cache
        id: mix_deps_cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          # Cache key based on Erlang/Elixir version and the mix.lock hash
          key: |
            deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
          path: |
            deps
            _build
      - name: Compile Elixir application to pick up colocated hooks
        run: mix compile
      - name: Run lints
        run: mise run lint:nodejs:*
      - name: Run tests
        run: mise run test:nodejs

  js_browser:
    name: JS (browser)
    runs-on: ${{ fromJSON(vars.GH_RUNNER_LABEL) }}
    needs: [changes, elixir_deps]
    if: ${{ needs.changes.outputs.js-changed == 'true' }}

    services:
      postgres:
        image: postgis/postgis:17-3.5
        ports:
          - 5432:5432
        env:
          # config/test.exs connects as this role.
          POSTGRES_PASSWORD: gtfs_planner_test
          POSTGRES_USER: gtfs_planner_test
          POSTGRES_DB: pathways_test
        # memory limit is 3GB
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5 --memory 3000000000

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Elixir
        uses: ./.github/actions/elixir
        id: beam
      - name: Restore dependencies cache
        id: deps_cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          # Cache key based on Erlang/Elixir version and the mix.lock hash
          key: |
            deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
          path: |
            deps
            _build
      - name: Set up Node
        id: node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: "assets/package-lock.json"
      - name: Compile app for colocated hooks
        # bin/test-browser builds the bundle in MIX_ENV=test, which imports
        # phoenix-colocated/gtfs_planner generated by mix compile.
        run: MIX_ENV=test mix compile
      - name: Run browser tests
        run: mise run test:browser
        env:
          # The service container above is the disposable server, so the browser
          # wrapper does not start pg_tmp. config/test.exs accepts this URL because
          # the host is loopback and the database starts with `gtfs_planner_exunit`.
          GTFS_PLANNER_TEST_DATABASE_URL: postgres://gtfs_planner_test:gtfs_planner_test@localhost:5432/gtfs_planner_exunit

  docker:
    name: Build Docker image
    runs-on: ${{ fromJSON(vars.GH_DOCKER_RUNNER_LABEL) }}
    timeout-minutes: 30
    needs: [changes]
    if: ${{ needs.changes.outputs.docker-changed == 'true' || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          lfs: true
      - name: Free disk space (targeted)
        run: |
          echo "Disk usage before cleanup:"
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          sudo apt-get clean

          echo "Disk usage after cleanup:"
          df -h
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Set cache parameters
        id: cache-outputs
        run: |
          if [ "${{ github.run_attempt }}" -eq "1" ]; then
            echo cache-from="type=gha" >> "$GITHUB_OUTPUT"
          else
            echo cache-from= >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          cache-to: type=gha,mode=max
          cache-from: ${{ steps.cache-outputs.outputs.cache-from }}
          tags: pathways
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: pathways
          trivy-config: trivy.yml
        env:
          TRIVY_SKIP_JAVA_DB_UPDATE: true

  infra:
    name: Lint/scan infrastructure
    runs-on: ${{ fromJSON(vars.GH_RUNNER_LABEL) }}
    needs: [changes]
    if: ${{ needs.changes.outputs.infra-changed == 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          install_args: "opentofu shellcheck uv"
          cache: true
      - name: Install checkov
        run: |
          # this works around not being able to install Checkov from GitHub due
          # to IP limiting from bridgecrewio
          checkov_version=$(grep -E "^checkov\s" ".tool-versions" | head -n 1 | awk '{print $2}')
          uv tool install "checkov@$checkov_version"
          echo "PATH=$HOME/.local/bin:$PATH" >> $GITHUB_ENV
      - name: Run linting/scanning
        run: mise run 'lint:infra:*'

  ci_passed:
    name: CI Passed?
    runs-on: ${{ fromJSON(vars.GH_RUNNER_LABEL) }}
    needs: [changes, elixir_deps, elixir_dev, elixir_test, js, js_browser, docker, infra]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Verify selected checks completed
        run: bin/check-ci-results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ELIXIR_CHANGED: ${{ needs.changes.outputs.elixir-changed }}
          JS_CHANGED: ${{ needs.changes.outputs.js-changed }}
          DOCKER_CHANGED: ${{ needs.changes.outputs.docker-changed }}
          INFRA_CHANGED: ${{ needs.changes.outputs.infra-changed }}
          ELIXIR_DEPS_RESULT: ${{ needs.elixir_deps.result }}
          ELIXIR_DEV_RESULT: ${{ needs.elixir_dev.result }}
          ELIXIR_TEST_RESULT: ${{ needs.elixir_test.result }}
          JS_RESULT: ${{ needs.js.result }}
          JS_BROWSER_RESULT: ${{ needs.js_browser.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          INFRA_RESULT: ${{ needs.infra.result }}
