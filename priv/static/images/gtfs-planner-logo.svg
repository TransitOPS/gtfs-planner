  <title id="logo-title">GTFS Planner — G14D.3B</title>
  <desc id="logo-description">Navy GTFS Planner lettering (Rubik SemiBold, converted to outlines) beside a teal transit route with two station rings and a pink dot inside the first station. Short continuing route extensions. Reconstructed from the approved concept with exact route geometry and flattened brand colors: navy #0A1330, teal #3FA8A8, pink #EE2A7B. Background and station openings are transparent. Text is outlined, so no external fonts or embedded raster images are needed.</desc>
